name: tripzo_app
description: "Tripzo — Plan the trail. Book the stay. Mobile app (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.3+1

  # Secure token storage (equivalent of expo-secure-store)
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Fonts (Inter, matching web app)
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Icons (compass / map-pin / trail motifs)
  lucide_icons: ^0.257.0

  # Utilities
  intl: ^0.19.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  pin_code_fields: ^8.0.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
